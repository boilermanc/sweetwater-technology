name: Build and Deploy Sweetwater Technology

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sweetwater-technology
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_URL: https://sweetwater.technology

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify deployment secrets
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_PORT: ${{ secrets.IONOS_PORT }}
          IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          IONOS_SWEETWATER_PATH: ${{ secrets.IONOS_SWEETWATER_PATH }}
        run: |
          missing=0
          require_secret() {
            if [ -z "${2:-}" ]; then
              echo "::error::$1 is missing"
              missing=1
            else
              echo "$1 is configured"
            fi
          }

          require_secret IONOS_HOST "$IONOS_HOST"
          require_secret IONOS_PORT "$IONOS_PORT"
          require_secret IONOS_USERNAME "$IONOS_USERNAME"
          require_secret IONOS_PASSWORD "$IONOS_PASSWORD"
          require_secret IONOS_SWEETWATER_PATH "$IONOS_SWEETWATER_PATH"

          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          set -euo pipefail
          npm run build
          echo "commit=${GITHUB_SHA}" > dist/build-info.txt
          date -u +"built_utc=%Y-%m-%dT%H:%M:%SZ" >> dist/build-info.txt
          printf '%s\n' \
            '# Never cache the SPA entry so new bundles are picked up immediately' \
            '<IfModule mod_headers.c>' \
            '  <Files "index.html">' \
            '    Header set Cache-Control "no-cache, no-store, must-revalidate"' \
            '    Header set Pragma "no-cache"' \
            '    Header set Expires 0' \
            '  </Files>' \
            '</IfModule>' \
            '' \
            '# SPA routing that still serves real files directly' \
            '<IfModule mod_rewrite.c>' \
            '  RewriteEngine On' \
            '  RewriteBase /' \
            '  RewriteCond %{REQUEST_FILENAME} -f [OR]' \
            '  RewriteCond %{REQUEST_FILENAME} -d' \
            '  RewriteRule ^ - [L]' \
            '  RewriteRule . /index.html [L]' \
            '</IfModule>' \
            > dist/.htaccess

      - name: Upload production build through SFTP
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_PORT: ${{ secrets.IONOS_PORT }}
          IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          IONOS_SWEETWATER_PATH: ${{ secrets.IONOS_SWEETWATER_PATH }}
        run: |
          set -euo pipefail
          sudo apt-get install -y lftp
          IONOS_SWEETWATER_PATH="$(printf '%s' "$IONOS_SWEETWATER_PATH" | tr -d '[:space:]')"
          REMOTE_PATH=""
          for candidate in \
            "$IONOS_SWEETWATER_PATH" \
            /httpdocs \
            httpdocs \
            /sweetwater.technology/httpdocs \
            sweetwater.technology/httpdocs \
            /var/www/vhosts/sweetwater.technology/httpdocs; do
            if lftp -c "set sftp:auto-confirm yes; \
              set cmd:fail-exit yes; \
              open -u \"$IONOS_USERNAME\",\"$IONOS_PASSWORD\" -p \"$IONOS_PORT\" sftp://$IONOS_HOST; \
              cls \"$candidate\"" >/dev/null 2>&1; then
              REMOTE_PATH="$candidate"
              break
            fi
          done

          if [ -z "$REMOTE_PATH" ]; then
            echo "::error::Could not locate the Sweetwater document root in the SFTP account."
            exit 1
          fi

          echo "Uploading dist/ to ${REMOTE_PATH}/ on ${IONOS_HOST}:${IONOS_PORT}"
          lftp -c "set sftp:auto-confirm yes; \
            set cmd:fail-exit yes; \
            set xfer:clobber yes; \
            open -u \"$IONOS_USERNAME\",\"$IONOS_PASSWORD\" -p \"$IONOS_PORT\" sftp://$IONOS_HOST; \
            mirror -R --verbose --parallel=4 ./dist/ \"$REMOTE_PATH/\"; \
            cls -l \"$REMOTE_PATH/\""

      - name: Verify live deployment
        run: |
          echo "Checking ${LIVE_URL}/build-info.txt"
          if remote="$(curl -fsS --max-time 20 "${LIVE_URL}/build-info.txt" 2>/dev/null)"; then
            echo "$remote"
            if echo "$remote" | grep -q "commit=${GITHUB_SHA}"; then
              echo "Live site is serving this commit."
            else
              echo "::warning::The live marker has not refreshed yet. Recheck after edge caches update."
            fi
          else
            echo "::warning::The upload completed, but build-info.txt could not be fetched yet."
          fi
